<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ukurasa Wangu wa Kwanza</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .kadi {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 400px;
    }
    h1 {
      color: #764ba2;
      margin-bottom: 10px;
    }
    p {
      color: #555;
      line-height: 1.6;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background: #764ba2;
    }
  </style>
</head>
<body>
  <div class="kadi">
    <h1>Habari Dunia! 🌍</h1>
    <p>Huu ni ukurasa wangu wa kwanza wa HTML. Umefanikiwa!</p>
    <p>Nilijifunza kuandika code kwenye simu yangu.</p>
    <button onclick="shangilia()">Bonyeza Hapa</button>
    <p id="ujumbe" style="color:#764ba2; font-weight:bold;"></p>
  </div>

  <script>
    function shangilia() {
      document.getElementById('ujumbe').innerText = '🎉 Hongera! Umefanya kazi!';
    }
  </script>
</body>
</html>
